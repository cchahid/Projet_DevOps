- name: Install Docker Engine and k3s on master and worker nodes
  hosts: all
  become: yes
  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - software-properties-common
        state: present

    - name: Remove old Kubernetes repository if it exists
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent

    - name: Add Kubernetes GPG key
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
        state: present

    - name: Add Kubernetes apt repository
      apt_repository:
        repo: "deb https://pkgs.k8s.io/core:/stable:/v1.28/deb/ /"
        state: present
        filename: "kubernetes"

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /usr/share/keyrings/docker-archive-keyring.gpg
        state: present

    - name: Add Docker's stable repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: "docker"

    - name: Update apt cache after adding repositories
      apt:
        update_cache: yes

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Ensure Docker is running and enabled on boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add azureuser to docker group
      user:
        name: azureuser
        groups: docker
        append: yes

    - name: Install k3s on master node
      shell: |
        curl -sfL https://get.k3s.io | sh -
      when: inventory_hostname in groups['masters']

    - name: Wait for k3s server to be ready
      wait_for:
        port: 6443
        host: "{{ ansible_default_ipv4.address }}"
        delay: 10
        timeout: 60
      when: inventory_hostname in groups['masters']

    - name: Get k3s join token from master node
      shell: "cat /var/lib/rancher/k3s/server/node-token"
      register: k3s_token
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      changed_when: false

    - name: Install k3s on worker nodes
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['masters'][0]].ansible_default_ipv4.address }}:6443 K3S_TOKEN={{ k3s_token.stdout }} sh -
      when: inventory_hostname in groups['workers']

    - name: Get latest stable kubectl version
      shell: "curl -L -s https://dl.k8s.io/release/stable.txt"
      register: kubectl_version
      changed_when: false

    - name: Install kubectl
      get_url:
       url: "https://dl.k8s.io/release/{{ kubectl_version.stdout }}/bin/linux/amd64/kubectl"
       dest: "/usr/local/bin/kubectl"
       mode: '0755'


    - name: Configure kubectl for k3s
      shell: |
        mkdir -p /home/azureuser/.kube
        if [ -f /etc/rancher/k3s/k3s.yaml ]; then
        sudo cp /etc/rancher/k3s/k3s.yaml /home/azureuser/.kube/config
        sudo chown azureuser:azureuser /home/azureuser/.kube/config
        fi
      when: inventory_hostname in groups['masters']

